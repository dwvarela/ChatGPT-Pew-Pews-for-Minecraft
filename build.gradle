plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.0.0'
group = 'com.example.vanillam16'
base { archivesName = 'vanilla_m16' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'; content { includeGroup('software.bernie.geckolib') } }
}
neoForge {
    version = '21.1.172'
    runs { client { client() }; server { server() } }
    mods { vanilla_m16 { sourceSet sourceSets.main } }
}
dependencies { implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.3" }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
