name: Build ChatGPT Pew Pew for Minecraft

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - ".github/workflows/build.yml"
      - "ChatGPT-Pew-Pew-recovery-workspace.zip"
      - "ChatGPT-Pew-Pew-complete-project.zip"
      - "ChatGPT-Pew-Pew-source-download.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate project archive
        id: archive
        shell: bash
        run: |
          if [ -f ChatGPT-Pew-Pew-source-download.zip ]; then
            echo "file=ChatGPT-Pew-Pew-source-download.zip" >> "$GITHUB_OUTPUT"
          elif [ -f ChatGPT-Pew-Pew-recovery-workspace.zip ]; then
            echo "file=ChatGPT-Pew-Pew-recovery-workspace.zip" >> "$GITHUB_OUTPUT"
          elif [ -f ChatGPT-Pew-Pew-complete-project.zip ]; then
            echo "file=ChatGPT-Pew-Pew-complete-project.zip" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No ChatGPT Pew Pew project ZIP found in the repository root."
            exit 1
          fi

      - name: Extract project workspace
        run: |
          unzip -q "${{ steps.archive.outputs.file }}" -d workspace
          test -f workspace/ChatGPT-Pew-Pew-for-Minecraft/build.gradle
          test -f workspace/ChatGPT-Pew-Pew-for-Minecraft/settings.gradle

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Apply GeckoLib 4 renderer import fix
        working-directory: workspace/ChatGPT-Pew-Pew-for-Minecraft
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/main/java/com/example/boltrifle/GeoModelItem.java")
          source = path.read_text(encoding="utf-8")
          old = "software.bernie.geckolib.renderer.GeoRenderProvider"
          new = "software.bernie.geckolib.animatable.client.GeoRenderProvider"
          if old in source:
              path.write_text(source.replace(old, new), encoding="utf-8")
              print("Updated GeoRenderProvider import for GeckoLib 4.")
          elif new in source:
              print("GeckoLib renderer import already fixed.")
          else:
              raise SystemExit("GeoRenderProvider import not found; inspect source before building.")

      - name: Validate resource references
        working-directory: workspace/ChatGPT-Pew-Pew-for-Minecraft
        run: python validate_project.py

      - name: Validate animation assets
        working-directory: workspace/ChatGPT-Pew-Pew-for-Minecraft
        run: python validate_animation_assets.py

      - name: Build mod JAR
        working-directory: workspace/ChatGPT-Pew-Pew-for-Minecraft
        run: gradle --no-daemon build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-pew-pew-for-minecraft
          path: workspace/ChatGPT-Pew-Pew-for-Minecraft/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
